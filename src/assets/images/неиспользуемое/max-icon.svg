<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка мессенджера MAX.
  Полностью переписана как набор чистых <path>-примитивов БЕЗ внешних
  зависимостей (нет <image xlink:href="data:..."/>, нет ссылок на внешние
  шрифты, нет <foreignObject>). Это гарантирует корректный рендеринг в любых
  окружениях — в т.ч. при сборке через CRA/webpack, где SVG-ассеты
  проходят через SVGR-трансформер.

  Композиция:
    • скруглённый зелёный фон (фирменный зелёный MAX) — один <rect> с rx/ry
    • белый «знак MAX» — стилизованная буква "M" с двумя пиками и волной снизу,
      имитирующая официальный логотип. Нарисована одним <path> с заливкой.
    • Для лучшей видимости на маленьких размерах (favicon в хедере 24×24)
      используются крупные формы и увеличенная толщина линий.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="MAX">
  <!-- Фирменный зелёный фон со скруглёнными углами (фирменный стиль MAX) -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#00B341"/>

  <!--
    Стилизованная буква "M" с волной внизу (характерный знак MAX):
      • левая вертикаль
      • диагональ к центру
      • диагональ вниз
      • правая вертикаль
      • нижняя волна, соединяющая обе стороны
    Координаты подобраны для viewBox 64×64, чтобы буква занимала
    основную часть иконки и была читаема даже на 16×16.
  -->
  <path
    d="M 14 48 L 14 18 L 22 18 L 32 34 L 42 18 L 50 18 L 50 48 L 43 48 L 43 30 L 35 43 L 29 43 L 21 30 L 21 48 Z"
    fill="#FFFFFF"
  />
</svg>