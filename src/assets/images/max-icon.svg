<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка мессенджера MAX.
  Чистый SVG без внедрённых base64-payload'ов: предыдущая версия использовала
  встроенный <image xlink:href="data:image/png;base64,..."> от Adobe Illustrator,
  и в некоторых окружениях (в частности при сборке через CRA/webpack-обработчик
  ассетов) он рендерился как пустой прямоугольник. Теперь иконка описана
  чистыми <path>-примитивами и корректно отрисовывается везде.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="MAX">
  <defs>
    <linearGradient id="maxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B341"/>
      <stop offset="100%" stop-color="#008F2E"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#maxGradient)"/>
  <path d="M32 12 C 41 12, 49 20, 49 30 C 49 38, 44 44, 37 47 L 37 56 L 27 56 L 27 47 C 20 44, 15 38, 15 30 C 15 20, 23 12, 32 12 Z M 32 22 L 32 38 L 26 30 Z" fill="#FFFFFF"/>
</svg>