name: Deploy to Beget (rain-lab.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-beget
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------- Диагностика резолва hero-видео ----------
      # Предыдущие раны падали на Build с `Can't resolve '../assets/videos/bgVideo.mp4'`,
      # хотя файл уже закоммичен (см. a78bd3a). Этот шаг показывает, реально ли checkout
      # донёс blob, и сможет ли Node.require() его увидеть — это та же логика, что у webpack.
      - name: Debug asset on disk
        run: |
          echo "=== HEAD ==="
          git rev-parse HEAD
          git log -1 --format='%H %ct %s' --no-patch
          echo "=== Tracked videos ==="
          git ls-files src/assets/videos/
          echo "=== On-disk videos ==="
          ls -la src/assets/videos/
          echo "=== find bgVideo anywhere ==="
          find . -iname 'bgVideo*' -not -path './node_modules/*' -not -path './.git/*' 2>/dev/null || true
          if [ -f src/assets/videos/bgVideo.mp4 ]; then
            echo "=== file ==="
            file src/assets/videos/bgVideo.mp4
            echo "=== stat ==="
            stat -c 'size=%s mtime=%y' src/assets/videos/bgVideo.mp4
            echo "=== first bytes (should contain 'ftyp') ==="
            xxd -l 32 src/assets/videos/bgVideo.mp4 || head -c 32 src/assets/videos/bgVideo.mp4 | od -c | head -2
            echo "=== node statSync ==="
            node -e "const s=require('fs').statSync('src/assets/videos/bgVideo.mp4'); console.log('size=',s.size,'mtime=',s.mtime)"
            echo "=== node require.resolve (same call webpack makes) ==="
            node -e "try{const r=require('path').resolve('src/assets/videos/bgVideo.mp4'); console.log('absPath=',r); const fs=require('fs'); console.log('exists=',fs.existsSync(r));}catch(e){console.error('FAIL',e);process.exit(2);}"
          else
            echo "!!! src/assets/videos/bgVideo.mp4 NOT FOUND on runner"
            echo "Listing every src/assets/ tree:"
            find src/assets -maxdepth 3 -type d 2>/dev/null
            echo "All videos under runner workspace:"
            find /home/runner/work -iname '*.mp4' 2>/dev/null || true
          fi

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html not found — npm run build failed?"
            exit 1
          fi
          echo "Build OK. Files:"
          ls -la build/ | head -40

      - name: Trust Beget host key
        run: |
          mkdir -p ~/.ssh
          # Отпечаток хоста Beget (ed25519), уже сверен через WinSCP
          echo "lizaptsw.beget.tech ssh-ed25519 YMhPGeCEuTL7ar3PAikIsHeuq3vjbTx5lSwRb04SPeQ" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SFTP (rsync-style)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          privateKey: ${{ secrets.BEGET_SSH_KEY }}
          localPath: ./build/
          remotePath: /home/l/lizaptsw/rain-lab.ru/public_html/
          args: -o ConnectTimeout=15 -o StrictHostKeyChecking=yes
