name: Deploy to Beget

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-beget
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          host: ${{ secrets.BEGET_SFTP_HOST }}
          username: ${{ secrets.BEGET_SFTP_USER }}
          privateKey: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          localPath: ./build/
          remotePath: /home/l/lizaptsw/greenstone.ru/public_html/
          args: -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/dev/null
