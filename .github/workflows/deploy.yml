name: Deploy to Beget (rain-lab.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-beget
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html not found — npm run build failed?"
            exit 1
          fi
          echo "Build OK. Files:"
          ls -la build/ | head -40

      - name: Trust Beget host key
        run: |
          mkdir -p ~/.ssh
          # Отпечаток хоста Beget (ed25519), уже сверен через WinSCP
          echo "lizaptsw.beget.tech ssh-ed25519 YMhPGeCEuTL7ar3PAikIsHeuq3vjbTx5lSwRb04SPeQ" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SFTP (rsync-style)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          privateKey: ${{ secrets.BEGET_SSH_KEY }}
          localPath: ./build/
          remotePath: /home/l/lizaptsw/rain-lab.ru/public_html/
          args: -o ConnectTimeout=15 -o StrictHostKeyChecking=yes
