name: Deploy to Beget (rain-lab.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-beget
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------- Диагностика hero-видео ----------
      # Сейчас в репо НЕТ файла bgVideoProlet.mp4 (он ~224 МБ, GitHub его
      # отклоняет, и CI его не должен видеть). webpack собирает проект без
      # него, а <video> в браузере запрашивает /static/media/bgVideoProlet.mp4
      # напрямую с сервера. Этот шаг только подтверждает, что в build/ этого
      # файла действительно нет — чтобы случайно не вернуть его в репо и
      # не сломать push в GitHub.
      - name: Debug hero-video on disk
        run: |
          echo "=== HEAD ==="
          git rev-parse HEAD
          git log -1 --format='%H %ct %s' --no-patch
          echo "=== Tracked videos ==="
          git ls-files src/assets/videos/ || echo "(none)"
          echo "=== On-disk videos (src/assets/videos/) ==="
          ls -la src/assets/videos/ 2>/dev/null || echo "(directory missing)"
          echo "=== Sanity: big mp4 must NOT be in build/ ==="
          if [ -f build/static/media/bgVideoProlet.mp4 ] || find build -iname 'bgVideoProlet*.mp4' -print -quit | grep -q .; then
            echo "::warning::bgVideoProlet.mp4 unexpectedly found in build/ — check webpack"
            find build -iname 'bgVideoProlet*.mp4' 2>/dev/null || true
          else
            echo "OK: build/ не содержит bgVideoProlet.mp4 (как и должно быть)"
          fi

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html not found — npm run build failed?"
            exit 1
          fi
          echo "Build OK. Files:"
          ls -la build/ | head -40

      - name: Trust Beget host key
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Получаем реальный host-key напрямую с сервера (а не угадываем).
          # Записываем и по hostname, и по IP — ssh сравнивает ровно то,
          # к чему подключаемся (lizaptsw.beget.tech, а не 91.106.207.46).
          # ssh-keyscan без -H пишет в формате [host]:port — используем -H (hashed),
          # что безопаснее и совместимо с StrictHostKeyChecking=yes.
          echo "Fetching host keys from Beget..."
          : > ~/.ssh/known_hosts
          ssh-keyscan -t ed25519 -T 15 lizaptsw.beget.tech >> ~/.ssh/known_hosts
          ssh-keyscan -t ed25519 -T 15 91.106.207.46    >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          KEY_LINES=$(wc -l < ~/.ssh/known_hosts)
          echo "=== known_hosts (lines: $KEY_LINES) ==="
          cat ~/.ssh/known_hosts
          if [ "$KEY_LINES" -lt 1 ]; then
            echo "::error::ssh-keyscan не вернул ни одного ключа от Beget"
            exit 1
          fi

      # ---------- Деплой через rsync по SSH ----------
      # Run #5 показал: ключ валиден (ssh-keygen -l вернул корректный fingerprint ED25519),
      # но wlixcc/SFTP-Deploy-Action@v1.2.4 портит формат при записи во временный файл
      # (`Load key "../private_key.pem": invalid format`). Обходим экшн и деплоим нативным rsync.
      # Секрет пишем через printf '%s\n', что доказало валидность (419 байт, ssh-keygen ok).
      - name: Deploy via rsync over SSH
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail

          # 1. Подготовка ключа в строго LF-формате с финальным \n
          install -m 700 -d ~/.ssh
          KEY_FILE=~/.ssh/beget_deploy_key
          printf '%s\n' "$BEGET_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Sanity-check: ключ должен парситься
          if ! ssh-keygen -l -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::BEGET_SSH_KEY невалиден после записи, ssh-keygen не смог распарсить"
            ssh-keygen -l -f "$KEY_FILE" || true
            exit 1
          fi
          echo "Key OK: $(ssh-keygen -l -f "$KEY_FILE")"

          # 2. Проверка SSH-доступа (dry-run ssh)
          SSH_TARGET="${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}"
          echo "Probing SSH to $SSH_TARGET..."
          if ! ssh -i "$KEY_FILE" \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  -o ConnectTimeout=15 \
                  -p 22 \
                  "$SSH_TARGET" 'echo "SSH-OK: $(whoami)@$(hostname)"'; then
            echo "::error::SSH-проверка провалилась. Проверьте authorized_keys на Beget и формат ключа."
            exit 1
          fi

          # 3. Rsync build/ → public_html/
          #    -a: archive (recursive, links, perms, times, group, owner, devices)
          #    -v: verbose
          #    -z: compress (полезно для mp4 и css)
          #    -O: --no-times (у нас нет прав на utimes() в public_html/)
          #    --checksum: обновление по содержимому (а не по размеру/timestamp)
          #
          #    Beget shared-hosting запрещает chmod/chown/chgrp/utimes на public_html/:
          #      run #8: rsync падал на utimes() → + -O
          #      run #10: rsync падал на chmod() → + --no-perms --no-owner --no-group
          #    Без этих трёх флагов rsync возвращает exit 23 ещё ДО начала копирования
          #    файлов (на первом же атрибуте каталога ./), и ничего не заливается.
          #
          #    БЕЗ --delete: на shared-хостинге это опасно (rsync сносит .ssh/,
          #    cgi-bin/, .cache/ — Beget хранит в public_html служебные папки;
          #    run #8 именно так потерял authorized_keys и SSH-доступ упал).
          #
          #    --exclude служебных папок: ДОПОЛНИТЕЛЬНАЯ защита — даже если --delete
          #    случайно вернётся, rsync НИКОГДА не тронет эти папки (--exclude
          #    обрабатывается ДО сравнения списков и сразу отсекает совпадения).
          #
          #    Старые ассеты (main.OLDHASH.js) остаются мусором, но не мешают:
          #    index.html ссылается на новые хэши из asset-manifest.json.
          #
          #    --exclude='.htaccess' — Beget имеет свой .htaccess, не затираем.
          REMOTE_DIR=/home/l/lizaptsw/rain-lab.ru/public_html/
          echo "Deploying build/ → $SSH_TARGET:$REMOTE_DIR"
          # На Beget rsync может вернуть 23 (partial transfer) даже если все файлы
          # успешно скопированы — например, при попытке chmod/chown отдельных
          # файлов, что мы запретили --no-perms/--no-owner/--no-group. Это
          # НОРМАЛЬНО: 23 означает «какие-то атрибуты не передались», но данные
          # уже на месте. Пост-проверка ниже всё равно найдёт файлы и поднимет
          # настоящий fail-fast если что-то пошло не так.
          rsync -avzO --no-perms --no-owner --no-group --checksum \
                --exclude='.htaccess' \
                --exclude='.ssh' \
                --exclude='.ssh/**' \
                --exclude='cgi-bin' \
                --exclude='cgi-bin/**' \
                --exclude='.cache' \
                --exclude='.cache/**' \
                -e "ssh -i $KEY_FILE -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 22" \
                ./build/ \
                "$SSH_TARGET:$REMOTE_DIR" || RSYNC_EXIT=$?
          RSYNC_EXIT=${RSYNC_EXIT:-0}
          echo "rsync exit code: $RSYNC_EXIT"
          if [ "$RSYNC_EXIT" -eq 255 ]; then
            # 255 = ssh/rsync фатальная ошибка (нет сети, аутентификация, диск полный).
            # 23 = partial transfer (атрибуты), это не фатально — пост-проверка решит.
            echo "::error::rsync фатальная ошибка (exit 255), см. лог выше"
            exit 1
          fi

          # 3.5. Очистка устаревших хешированных ассетов на сервере.
          #      rsync без --delete их НЕ удаляет (намеренно, чтобы не снести
          #      служебные папки Beget вроде .ssh/), поэтому отдельный шаг
          #      аккуратно удаляет только CRA-ассеты и bgVideo, чьи хеши
          #      больше не совпадают с актуальной сборкой. Подробности и
          #      whitelist — в scripts/cleanup-stale-assets.sh.
          export BEGET_REMOTE_DIR="$REMOTE_DIR"
          bash scripts/cleanup-stale-assets.sh

          # 4. Пост-проверка: на сервере должен лежать index.html, mp4,
          #    и служебные папки Beget (.ssh/, cgi-bin/, .cache/) должны быть на месте.
          #    Используем heredoc, чтобы не возиться с экранированием кавычек.
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -p 22 \
              "$SSH_TARGET" bash -s -- "$REMOTE_DIR" <<-'REMOTE_EOF'
          REMOTE_DIR="$1"
          echo "--- public_html/ (top 25) ---"
          ls -la "$REMOTE_DIR" | head -25
          echo "--- index.html ---"
          if [ -f "$REMOTE_DIR/index.html" ]; then
            echo "index.html OK ($(wc -c < "$REMOTE_DIR/index.html") bytes)"
          else
            echo "::error::index.html MISSING on server"
            exit 1
          fi
          echo "--- bgVideoProlet.mp4 ---"
          # Герой-видео НЕ приходит из CI: rsync его не тащит (его нет в build/),
          # а кладётся вручную через WinSCP. На сервере он лежит под именем
          # bgVideoProlet.mp4 (без хеша). Предупреждаем, если пропал — это
          # повод залить его снова, но НЕ повод ронять деплой (сайт без
          # видео всё равно работает: постер + <video poster> рендерится).
          if [ -f "$REMOTE_DIR/static/media/bgVideoProlet.mp4" ]; then
            echo "bgVideoProlet.mp4 OK ($(wc -c < "$REMOTE_DIR/static/media/bgVideoProlet.mp4") bytes)"
          else
            echo "::warning::bgVideoProlet.mp4 NOT FOUND on server — залейте вручную через WinSCP"
          fi
          echo "--- service folders (must survive) ---"
          for d in .ssh cgi-bin .cache; do
            if [ -e "$REMOTE_DIR$d" ]; then
              echo "$d: present"
            else
              echo "::warning::$d: MISSING"
            fi
          done
          REMOTE_EOF
          echo "✅ Deploy completed"
