<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Предзагрузка постера видео с главной — показывается мгновенно,
         пока грузится сам MP4 (избавляет от «чёрного прямоугольника» в первые секунды) -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/poster-hero-mini.jpg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.
      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <title>Rain-Lab — Лаборатория дождя</title>
    <meta
      name="description"
      content="Проектирование, монтаж и обслуживание систем автоматического полива в Санкт-Петербурге и Ленинградской области. Автополив под ключ — гарантия 5 лет."
    />

    <!-- Open Graph для превью при шаринге (фолбэк до монтирования React) -->
    <meta property="og:title" content="Rain-Lab — Лаборатория дождя" />
    <meta
      property="og:description"
      content="Проектирование, монтаж и обслуживание систем автоматического полива в СПб и ЛО."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rain-lab.ru/" />
    <meta property="og:image" content="https://rain-lab.ru/og-image.jpg" />
    <meta property="og:site_name" content="Rain-Lab" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rain-Lab — Лаборатория дождя" />
    <meta
      name="twitter:description"
      content="Проектирование, монтаж и обслуживание систем автоматического полива в СПб и ЛО."
    />
    <meta name="twitter:image" content="https://rain-lab.ru/og-image.jpg" />

    <!-- Канонический URL главной страницы (фолбэк; per-route URL перетирается react-helmet-async в SeoHead) -->
    <link rel="canonical" href="https://rain-lab.ru/" />

    <!-- JSON-LD: базовая информация о компании (фолбэк до React) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://rain-lab.ru/#org",
        "name": "Rain-Lab",
        "alternateName": "Лаборатория дождя",
        "url": "https://rain-lab.ru",
        "logo": "https://rain-lab.ru/logo.png",
        "image": "https://rain-lab.ru/og-image.jpg",
        "description": "Проектирование, монтаж и обслуживание систем автоматического полива в Санкт-Петербурге и Ленинградской области. Автополив под ключ — гарантия 5 лет.",
        "foundingDate": "2018",
        "email": "info@rain-lab.ru",
        "telephone": "+7-999-529-20-65",
        "priceRange": "₽₽",
        "currenciesAccepted": "RUB",
        "paymentAccepted": "Cash, Credit Card, Bank Transfer",
        "areaServed": [
            { "@type": "City", "name": "Санкт-Петербург" },
            { "@type": "State", "name": "Ленинградская область" }
        ],
        "knowsAbout": [
            "Автоматический полив",
            "Капельное орошение",
            "Дождевание",
            "Системы орошения",
            "Ландшафтный полив",
            "Hunter",
            "Rain Bird",
            "Поливторг"
        ],
        "brand": {
            "@type": "Brand",
            "name": "Поливторг"
        },
        "member": {
            "@type": "Organization",
            "name": "Поливторг",
            "description": "Поставщик оборудования для систем автоматического полива"
        },
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Санкт-Петербург",
            "addressRegion": "Ленинградская область",
            "addressCountry": "RU"
        },
        "geo": {
            "@type": "GeoCoordinates",
            "latitude": 59.9311,
            "longitude": 30.3609
        },
        "openingHoursSpecification": [
            {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
                "opens": "09:00",
                "closes": "20:00"
            },
            {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": "Saturday",
                "opens": "10:00",
                "closes": "18:00"
            }
        ]
    }
    </script>

    <!-- JSON-LD: WebSite + SearchAction — для снippetа поиска -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://rain-lab.ru/#website",
        "url": "https://rain-lab.ru",
        "name": "Rain-Lab — Лаборатория дождя",
        "inLanguage": "ru-RU",
        "publisher": { "@id": "https://rain-lab.ru/#org" }
    }
    </script>
  </head>
  <body>
    <noscript>Rain-Lab — Лаборатория дождя. Автополив под ключ в Санкт-Петербурге. Включите JavaScript для полноценной работы сайта.</noscript>
    <div id="root"></div>
